<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#15171a;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.lg{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:40px 28px}
.bar{width:56px;height:6px;background:#d7261e;border-radius:3px}
h1{font-size:34px;margin:14px 0 4px;letter-spacing:-.02em}
p{color:#5a6067;margin:0 0 24px}
label{display:block;font-size:14px;color:#5a6067;margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;font:17px inherit;padding:12px 14px;border:1px solid #c9cdd2;border-radius:12px;min-height:48px}
input:focus{outline:3px solid #ef8a00;outline-offset:1px}
.ck{display:flex;gap:10px;align-items:center;margin:16px 0 0;color:#15171a;font-size:16px}
.ck input{width:22px;height:22px;accent-color:#d7261e}
button{width:100%;margin-top:18px;min-height:54px;border:0;border-radius:28px;background:#d7261e;color:#fff;font:600 18px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#b3261e;min-height:22px;margin-top:10px;font-size:15px}
.note{font-size:14px;color:#5a6067;margin-top:18px}
</style>
</head>
<body>
<form class="lg" id="lg" autocomplete="on">
  <div class="bar"></div>
  <h1>GBA Trip</h1>
  <p>Sign in to open your trip, expenses and dealer book.</p>
  <label for="u">Username</label><input id="u" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <label class="ck"><input type="checkbox" id="k">Keep me signed in on this phone</label>
  <div class="err" id="e" role="alert"></div>
  <button type="submit" id="b">Unlock</button>
  <div class="note">Works offline once opened. Your trip data stays on this phone. Version 1.6.</div>
</form>
